<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aveniq – App</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#faf7ef;--ink:#0d2b1f;--lime:#a3d92b;--mute:#5d6b63;--line:#e3e1d6;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.btn{background:var(--ink);color:#fff;border:0;border-radius:30px;padding:12px 22px;font-weight:600;cursor:pointer}
.btn.lime{background:var(--lime);color:var(--ink)}.btn.ghost{background:none;border:1px solid #cfcbbd;color:var(--ink)}.btn.sm{padding:7px 14px;font-size:13px}.btn:disabled{opacity:.6}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid #d6d3c6;border-radius:12px;background:#fff;margin-top:6px}
label{font-size:13px;font-weight:600;display:block;margin-top:14px}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 80% 0,#e3f2b9,transparent 55%)}
.box{background:#fff;border-radius:24px;padding:36px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(13,43,31,.12)}
.logo{font-size:30px;font-weight:700;letter-spacing:-1px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tabs{display:flex;background:#f0eddf;border-radius:30px;padding:4px;margin:22px 0 4px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:26px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.err{color:#c43a2a;font-size:13px;margin-top:12px;min-height:18px}
.free{display:inline-block;background:#e7f3c9;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700}
#app{display:flex;min-height:100vh}
aside{width:210px;background:var(--ink);color:#e6efe8;padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside .logo{color:#fff;font-size:24px;padding:0 8px 22px}
aside a{padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:4px;font-size:14px;font-weight:500}
aside a.on{background:#2c5a2b;color:#fff}aside a:hover{background:#17402c}
aside .bot{margin-top:auto;font-size:12px;padding:8px}
main{flex:1;padding:30px 36px;min-width:0}
h2{font-size:32px;letter-spacing:-.8px}.sub{color:var(--mute);font-size:14px;margin-top:4px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:22px 0}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.stat b{font-size:30px;display:block}.stat span{font-size:13px;color:var(--mute)}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eee9db}.row:last-child{border:0}
.row .n{flex:1;min-width:0;font-weight:600;font-size:14px}.row .n small{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{padding:6px 12px;border-radius:14px;font-size:12px;font-weight:600;white-space:nowrap}
.urgent{background:#fbd9d4;color:#c43a2a}.today{background:#fbe6c4;color:#b7791a}.tomorrow,.normal{background:#e6e4dc;color:#444}
.new{background:#dcebff;color:#1d5fb4}.contacted{background:#fbe6c4;color:#b7791a}.converted{background:#d5f0d2;color:#1f7a2e}.lost{background:#eee;color:#777}
.draft{white-space:pre-wrap;font-size:14px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;color:var(--mute);padding:8px}td{padding:12px 8px;border-top:1px solid #eee9db}
.bar{height:14px;border-radius:8px;background:var(--lime);min-width:4px}
.modal{position:fixed;inset:0;background:rgba(13,43,31,.5);display:grid;place-items:center;padding:20px;z-index:9}
.modal .box{max-height:90vh;overflow:auto}
.empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;z-index:20}
@media(max-width:820px){#app{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;gap:4px;padding:12px}aside .logo{padding:0 8px;width:100%}aside .bot{display:none}main{padding:20px 16px}.cols{grid-template-columns:1fr}}
</style></head><body>

<div id="auth" class="hide"><div class="box">
 <div class="logo">✦ Aveniq</div><span class="free">Free for now</span>
 <div class="tabs"><button id="tIn" class="on" onclick="tab('in')">Sign in</button><button id="tUp" onclick="tab('up')">Sign up</button></div>
 <div id="upf" class="hide"><label>Your name<input id="fn" autocomplete="name"></label><label>Business name<input id="bn"></label></div>
 <label>Email<input id="em" type="email" autocomplete="email"></label>
 <label>Password<input id="pw" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label>
 <div class="err" id="aerr"></div>
 <button class="btn lime" id="abtn" style="width:100%;margin-top:6px" onclick="submitAuth()">Sign in</button>
 <p class="sub" style="margin-top:16px;text-align:center"><a href="./" style="color:inherit">← Back to home</a></p>
</div></div>

<div id="app" class="hide">
 <aside><div class="logo">✦ Aveniq</div>
  <a data-v="dash" onclick="go('dash')">Dashboard</a><a data-v="leads" onclick="go('leads')">Leads</a><a data-v="ai" onclick="go('ai')">AI Assistant</a><a data-v="stats" onclick="go('stats')">Analytics</a><a data-v="set" onclick="go('set')">Settings</a>
  <div class="bot"><span class="free">Free plan</span><br><br><a onclick="out()" style="padding:0">Sign out</a></div>
 </aside>
 <main id="main"></main>
</div>
<div id="modal"></div><div id="toast" class="hide"></div>

<script>
const sb=supabase.createClient('https://ihbblnbqjzdewiopqmxd.supabase.co','sb_publishable_vqKKGrWuY7C6H3DfyoTPVQ_cGqBlLjS');
const $=i=>document.getElementById(i);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='in',user=null,profile={},leads=[],drafts=[],view='dash',sel=null;
const PRI={urgent:0,today:1,tomorrow:2,normal:3};
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),2400)}
function tab(m){mode=m;$('tIn').className=m=='in'?'on':'';$('tUp').className=m=='up'?'on':'';$('upf').classList.toggle('hide',m=='in');$('abtn').textContent=m=='in'?'Sign in':'Create free account';$('aerr').textContent=''}
async function submitAuth(){
 const email=$('em').value.trim(),password=$('pw').value,b=$('abtn');$('aerr').textContent='';
 if(!email||password.length<6){$('aerr').textContent='Enter an email and a password of at least 6 characters.';return}
 b.disabled=true;let r;
 if(mode=='up'){r=await sb.auth.signUp({email,password,options:{data:{full_name:$('fn').value.trim(),business_name:$('bn').value.trim()}}});
  if(!r.error&&!r.data.session)r=await sb.auth.signInWithPassword({email,password});
  if(!r.error&&r.data.session)localStorage.setItem('aveniq_new',JSON.stringify({f:$('fn').value.trim(),b:$('bn').value.trim()}))}
 else r=await sb.auth.signInWithPassword({email,password});
 b.disabled=false;
 if(r.error){$('aerr').textContent=r.error.message.includes('rate')?'Too many tries. Wait a minute and try again.':r.error.message;return}
 boot(r.data.session)}
async function out(){await sb.auth.signOut();location.reload()}
async function boot(session){
 if(!session){$('auth').classList.remove('hide');$('app').classList.add('hide');return}
 user=session.user;$('auth').classList.add('hide');$('app').classList.remove('hide');
 let {data:p}=await sb.from('aveniq_profiles').select('*').eq('id',user.id).maybeSingle();
 if(!p){let n={};try{n=JSON.parse(localStorage.getItem('aveniq_new')||'{}')}catch(e){}
  const m=user.user_metadata||{};
  const row={id:user.id,full_name:n.f||m.full_name||'',business_name:n.b||m.business_name||''};
  await sb.from('aveniq_profiles').upsert(row);p=row;localStorage.removeItem('aveniq_new')}
 profile=p;await load();go('dash')}
async function load(){
 const [a,b]=await Promise.all([sb.from('aveniq_leads').select('*').order('created_at',{ascending:false}),sb.from('aveniq_drafts').select('*').order('created_at',{ascending:false})]);
 leads=a.data||[];drafts=b.data||[]}
function go(v){view=v;document.querySelectorAll('aside a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v==v));render()}
function mk(l){const f=(l.name||'').split(' ')[0];
 return `Hi ${f},\n\nThanks for reaching out${l.service?` about ${l.service.toLowerCase()}`:''}! We'd love to help.${l.priority=='urgent'?' We can get you on the schedule as soon as today.':''} What day and time work best for you?\n\nBest,\n${profile.full_name||''}${profile.business_name?'\n'+profile.business_name:''}`}
const tag=(c,t)=>`<span class="tag ${c}">${E(t||c)}</span>`;
const cap=s=>s[0].toUpperCase()+s.slice(1);
function pri(){return leads.filter(l=>l.status=='new'||l.status=='contacted').sort((a,b)=>PRI[a.priority]-PRI[b.priority])}
function render(){
 const m=$('main'),wk=Date.now()-7*864e5;
 const nNew=leads.filter(l=>new Date(l.created_at)>wk).length,due=leads.filter(l=>['urgent','today'].includes(l.priority)&&l.status!='converted'&&l.status!='lost').length,conv=leads.filter(l=>l.status=='converted').length;
 if(view=='dash'){const P=pri().slice(0,5),top=P.find(l=>l.status=='new');
  m.innerHTML=`<div class="top"><div><h2>Today</h2><div class="sub">Here's what's happening with your leads.</div></div><button class="btn lime" onclick="addLead()">+ Add lead</button></div>
  <div class="stats"><div class="card stat"><b>${nNew}</b><span>New leads (7 days)</span></div><div class="card stat"><b>${due}</b><span>Follow-ups due</span></div><div class="card stat"><b>${conv}</b><span>Converted</span></div><div class="card stat"><b>${leads.length}</b><span>Total leads</span></div></div>
  <div class="cols"><div class="card"><h3 style="margin-bottom:6px">Priority leads</h3>${P.length?P.map(l=>`<div class="row"><div class="n">${E(l.name)}<small>${E(l.service||l.message||'No details')}</small></div>${tag(l.priority,cap(l.priority))}<button class="btn ghost sm" onclick="openLead('${l.id}')">View →</button></div>`).join(''):'<div class="empty">No leads yet. Add your first lead to get started.</div>'}</div>
  <div class="card"><h3>✦ AI Draft</h3>${top?`<p class="sub" style="margin:6px 0 10px">For ${E(top.name)}</p><div class="draft">${E(mk(top))}</div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn sm" onclick="approve('${top.id}')">✓ Approve</button><button class="btn ghost sm" onclick="sel='${top.id}';go('ai')">Edit</button></div>`:'<div class="empty">New leads get a ready-to-send reply here.</div>'}</div></div>`}
 else if(view=='leads'){m.innerHTML=`<div class="top"><div><h2>Leads</h2><div class="sub">${leads.length} total</div></div><button class="btn lime" onclick="addLead()">+ Add lead</button></div>
  <div class="card" style="margin-top:20px;overflow:auto">${leads.length?`<table><tr><th>Name</th><th>Service</th><th>Contact</th><th>Priority</th><th>Status</th><th></th></tr>${leads.map(l=>`<tr><td><b>${E(l.name)}</b></td><td>${E(l.service)}</td><td>${E(l.email||l.phone)}</td><td>${tag(l.priority,cap(l.priority))}</td><td>${tag(l.status,cap(l.status))}</td><td style="white-space:nowrap"><button class="btn ghost sm" onclick="openLead('${l.id}')">View</button> <button class="btn ghost sm" onclick="delLead('${l.id}')">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No leads yet.</div>'}</div>`}
 else if(view=='ai'){const L=pri(),cur=leads.find(l=>l.id==sel)||L[0];
  m.innerHTML=`<h2>AI Assistant</h2><div class="sub">Pick a lead, get a reply drafted, edit it, and approve.</div>
  <div class="card" style="margin-top:20px;max-width:680px">${leads.length?`<label style="margin-top:0">Lead<select id="sl" onchange="sel=this.value;render()">${leads.map(l=>`<option value="${l.id}" ${cur&&cur.id==l.id?'selected':''}>${E(l.name)} – ${E(l.service||'Inquiry')}</option>`).join('')}</select></label>
  ${cur&&cur.message?`<p class="sub" style="margin-top:12px">They wrote: “${E(cur.message)}”</p>`:''}
  <label>Draft reply<textarea id="dt" rows="9">${E(mk(cur))}</textarea></label>
  <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn" onclick="approve('${cur.id}',$('dt').value)">✓ Approve</button><button class="btn ghost" onclick="$('dt').value=mk(leads.find(l=>l.id=='${cur.id}'))">Reset draft</button><button class="btn ghost" onclick="navigator.clipboard.writeText($('dt').value);toast('Copied')">Copy</button></div>`:'<div class="empty">Add a lead first.</div>'}</div>
  <h3 style="margin:26px 0 8px">Approved replies</h3><div class="card">${drafts.length?drafts.slice(0,8).map(d=>`<div class="row"><div class="n">${E((leads.find(l=>l.id==d.lead_id)||{}).name||'Lead')}<small>${E(d.body)}</small></div>${tag('converted','Approved')}</div>`).join(''):'<div class="empty">Nothing approved yet.</div>'}</div>`}
 else if(view=='stats'){const S=['new','contacted','converted','lost'],mx=Math.max(1,...S.map(s=>leads.filter(l=>l.status==s).length));
  m.innerHTML=`<h2>Analytics</h2><div class="sub">How your leads are moving.</div><div class="stats"><div class="card stat"><b>${leads.length?Math.round(conv/leads.length*100):0}%</b><span>Conversion rate</span></div><div class="card stat"><b>${drafts.length}</b><span>Replies approved</span></div></div>
  <div class="card" style="max-width:640px"><h3 style="margin-bottom:12px">Leads by status</h3>${S.map(s=>{const c=leads.filter(l=>l.status==s).length;return `<div style="display:flex;align-items:center;gap:12px;margin:10px 0"><span style="width:90px;font-size:14px">${cap(s)}</span><div class="bar" style="width:${c/mx*70}%"></div><b>${c}</b></div>`}).join('')}</div>`}
 else m.innerHTML=`<h2>Settings</h2><div class="sub">${E(user.email)}</div><div class="card" style="max-width:480px;margin-top:20px"><label style="margin-top:0">Your name<input id="sn" value="${E(profile.full_name)}"></label><label>Business name<input id="sb" value="${E(profile.business_name)}"></label><button class="btn lime" style="margin-top:18px" onclick="saveSet()">Save</button></div><div class="card" style="max-width:480px;margin-top:16px"><b>Free plan</b><p class="sub">Aveniq is free for now. Upgrades will come later.</p></div>`}
async function saveSet(){const r={id:user.id,full_name:$('sn').value.trim(),business_name:$('sb').value.trim()};const {error}=await sb.from('aveniq_profiles').upsert(r);if(error)return toast(error.message);profile=r;toast('Saved')}
function modal(h){$('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="box">${h}</div></div>`}
function closeM(){$('modal').innerHTML=''}
function addLead(){modal(`<h3>Add lead</h3><label>Name<input id="ln"></label><label>Email<input id="le" type="email"></label><label>Phone<input id="lp"></label><label>Service<input id="ls" placeholder="e.g. House cleaning"></label><label>Message<textarea id="lm" rows="3"></textarea></label><label>Priority<select id="lr"><option value="normal">Normal</option><option value="tomorrow">Tomorrow</option><option value="today">Today</option><option value="urgent">Urgent</option></select></label><div class="err" id="lerr"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn lime" onclick="saveLead()">Save lead</button><button class="btn ghost" onclick="closeM()">Cancel</button></div>`)}
async function saveLead(){const name=$('ln').value.trim();if(!name){$('lerr').textContent='Name is required.';return}
 const {error}=await sb.from('aveniq_leads').insert({name,email:$('le').value.trim()||null,phone:$('lp').value.trim()||null,service:$('ls').value.trim()||null,message:$('lm').value.trim()||null,priority:$('lr').value});
 if(error){$('lerr').textContent=error.message;return}closeM();await load();render();toast('Lead added')}
function openLead(id){const l=leads.find(x=>x.id==id);modal(`<h3>${E(l.name)}</h3><p class="sub">${E(l.service||'Inquiry')} · ${E(l.email||l.phone||'No contact info')}</p>${l.message?`<p style="margin-top:12px;font-size:14px">“${E(l.message)}”</p>`:''}<label>Status<select id="st">${['new','contacted','converted','lost'].map(s=>`<option ${l.status==s?'selected':''} value="${s}">${cap(s)}</option>`).join('')}</select></label><label>Priority<select id="pr">${['urgent','today','tomorrow','normal'].map(s=>`<option ${l.priority==s?'selected':''} value="${s}">${cap(s)}</option>`).join('')}</select></label><div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap"><button class="btn lime" onclick="upd('${id}')">Save</button><button class="btn ghost" onclick="closeM();sel='${id}';go('ai')">Write reply</button><button class="btn ghost" onclick="closeM()">Close</button></div>`)}
async function upd(id){const {error}=await sb.from('aveniq_leads').update({status:$('st').value,priority:$('pr').value}).eq('id',id);if(error)return toast(error.message);closeM();await load();render();toast('Updated')}
async function delLead(id){if(!confirm('Delete this lead?'))return;await sb.from('aveniq_leads').delete().eq('id',id);await load();render()}
async function approve(id,body){const l=leads.find(x=>x.id==id);body=body||mk(l);
 const {error}=await sb.from('aveniq_drafts').insert({lead_id:id,body,status:'approved'});if(error)return toast(error.message);
 await sb.from('aveniq_leads').update({status:'contacted'}).eq('id',id);await load();render();toast('Reply approved')}
sb.auth.getSession().then(({data})=>boot(data.session));
</script></body></html>
