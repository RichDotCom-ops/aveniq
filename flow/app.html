</style>

const SB_URL='https://ihbblnbqjzdewiopqmxd.supabase.co',SB_KEY='sb_publishable_vqKKGrWuY7C6H3DfyoTPVQ_cGqBlLjS';

/* ---------- auth ---------- */
let mode='in';

 else r=await sb.auth.signInWithPassword({email:em,password:pw});
 if(r?.error)msg(r.error.message);$('#ab').disabled=false};

 if(ev==='PASSWORD_RECOVERY'){$('#auth').style.display='grid';authMode('reset')}
 else if(ev==='SIGNED_OUT'){booted=false;S.user=null;$('#auth').style.display='grid';authMode('in')}
 else if(session&&ev!=='TOKEN_REFRESHED'&&mode!=='reset')setTimeout(()=>boot(session.user),0)});

/* ---------- data ---------- */
async function loadAll(){
 const [st,tk,cu,ap,au,it,ac,ms]=await Promise.all([T('settings').select('*').maybeSingle(),T('tasks').select('*').order('created_at',{ascending:false}),T('customers').select('*').order('created_at',{ascending:false}),T('appointments').select('*').order('starts_at'),T('automations').select('*').order('created_at'),T('integrations').select('*'),T('activity').select('*').order('created_at',{ascending:false}).limit(20),T('messages').select('*').order('created_at',{ascending:false}).limit(40)]);
 S.settings=st.data;S.tasks=tk.data||[];S.customers=cu.data||[];S.appts=ap.data||[];S.auto=au.data||[];
 S.integ={};(it.data||[]).forEach(r=>S.integ[r.app]=r.connected);S.activity=ac.data||[];S.msgs=(ms.data||[]).reverse()}
async function seed(){
 const n=new Date(),at=(h,m=0)=>{const d=new Date(n);d.setHours(h,m,0,0);return d.toISOString()},ts=i=>new Date(n-6000+i*1000).toISOString();
 await db(T('settings').insert({display_name:S.user.user_metadata?.name||S.user.email.split('@')[0],seeded:true}));
 await db(T('tasks').insert([["Client meeting with Sarah","9:00 AM","High"],["Reply to customer emails","11:30 AM","Medium"],["Prepare marketing report","3:00 PM","Medium"]].map((r,i)=>({title:r[0],due:r[1],priority:r[2],sample:true,created_at:ts(i)}))));
 await db(T('appointments').insert([{title:"Team Sync",starts_at:at(10),ends_at:at(11),kind:"meeting",sample:true},{title:"Client Call",starts_at:at(14),ends_at:at(14,30),kind:"call",sample:true}]));
 await db(T('customers').insert([["Sarah Mitchell","Commercial","Meeting today"],["Oakridge Dental","Commercial","Quote pending"],["Hartley Home","Residential","Recurring biweekly"],["J. Park","Residential","New inquiry"]].map(c=>({name:c[0],kind:c[1],status:c[2],sample:true}))));
 await db(T('automations').insert([{name:"New customer inquiry → create follow-up task"},{name:"Appointment scheduled → prepare reminder"},{name:"Email needs reply → create draft",enabled:false}]));
 await db(T('integrations').insert(APPS.map(app=>({app,connected:true}))));
 await loadAll()}
async function boot(user){if(booted&&S.user?.id===user.id)return;booted=true;S.user=user;
 await loadAll();if(!S.settings)await seed();
 $('#auth').style.display='none';renderMsgs();render()}
async function log(text){const r=await db(T('activity').insert({text}).select().single());if(r&&r!==true)S.activity.unshift(r)}

/* ---------- tools (what Avo and the UI can do) ---------- */
const TOOLS={
 async create_task(a){const r=await db(T('tasks').insert({title:a.title,due:a.due||null,priority:a.priority||'Medium'}).select().single());if(r&&r!==true){S.tasks.unshift(r);await log('Created task: '+a.title)}},
 async complete_task(a){const r=await db(T('tasks').update({done:true,done_at:new Date().toISOString()}).eq('id',a.id).select().single());if(r&&r!==true){Object.assign(S.tasks.find(t=>t.id===a.id),r);await log('Completed: '+(a.title||r.title))}},
 async create_customer(a){const r=await db(T('customers').insert({name:a.name,email:a.email||null,phone:a.phone||null,status:'New'}).select().single());if(r&&r!==true){S.customers.unshift(r);await log('Added customer: '+a.name)}},
 async create_appointment(a){const r=await db(T('appointments').insert({title:a.title,starts_at:a.starts_at,ends_at:a.ends_at||null,kind:a.kind||'meeting'}).select().single());if(r&&r!==true){S.appts.push(r);S.appts.sort((x,y)=>new Date(x.starts_at)-new Date(y.starts_at));await log('Scheduled: '+a.title)}},
 async toggle_automation(a){const r=await db(T('automations').update({enabled:a.enabled}).eq('id',a.id).select().single());if(r&&r!==true){Object.assign(S.auto.find(x=>x.id===a.id),r);await log((a.enabled?'Enabled: ':'Paused: ')+(a.name||r.name))}},
 async log(a){await log(a.text)}};

/* ---------- views ---------- */
function head(){const h=new Date().getHours();$('#h').textContent=view==="home"?`Good ${h<12?'morning':h<18?'afternoon':'evening'}, ${name()}!`:NAV.find(n=>n[0]===view)[1];
 $('#sub').textContent=view==="home"?"Let’s make today productive ✨":"";$('#sub').style.display=view==="home"?"":"none"}
function series(){const n=sod(new Date()),d=S.tasks.filter(t=>t.done_at).map(t=>new Date(t.done_at));
 if(S.range==="This Week"){const a=Array(7).fill(0);d.forEach(x=>{const k=Math.floor((n-sod(x))/864e5);if(k>=0&&k<7)a[6-k]++});return a}
 const a=Array(4).fill(0);d.forEach(x=>{const k=Math.floor((n-x)/(7*864e5));if(k>=0&&k<4)a[3-k]++});return a}
function pathOf(a){const mx=Math.max(1,...a),p=a.map((v,i)=>[8+i*384/(a.length-1),112-v/mx*84]);let d=`M${p[0][0]} ${p[0][1]}`;for(let i=1;i<p.length;i++){const [x0,y0]=p[i-1],[x1,y1]=p[i],c=(x0+x1)/2;d+=`C${c} ${y0} ${c} ${y1} ${x1} ${y1}`}return d}
function upcoming(){const s=sod(new Date());return S.appts.filter(a=>new Date(a.starts_at)>=s).slice(0,2)}
function homeHTML(){
 const o=openT().slice(0,3),up=upcoming(),dd=up[0]?new Date(up[0].starts_at):new Date(),sr=series(),d=pathOf(sr),sum=sr.reduce((x,y)=>x+y,0);
 const td=S.appts.filter(a=>sod(a.starts_at).getTime()===sod(new Date()).getTime()).length,n=APPS.filter(k=>S.integ[k]).length;
 const it=[{id:'int',name:'Gmail',sub:S.integ.Gmail?'Connected':'Tap to connect',on:!!S.integ.Gmail,side:'l',row:0},
 {id:'int',name:'Notion',sub:S.integ.Notion?'Connected':'Tap to connect',on:!!S.integ.Notion,side:'l',row:1},
 {id:'tasks',name:'Tasks',sub:openT().length+' open',on:true,side:'l',row:2},
 {id:'cal',name:'Calendar',sub:S.integ.Calendar?td+' today':'Tap to connect',on:!!S.integ.Calendar,side:'r',row:0},
 {id:'int',name:'Slack',sub:S.integ.Slack?'Connected':'Tap to connect',on:!!S.integ.Slack,side:'r',row:1},
 {id:'cust',name:'Customers',sub:S.customers.length+' total',on:true,side:'r',row:2}];
 return `<div class="home ${pOpen&&wide()?'':'nopanel'}"><div class="stagew">${Puzzle.render(it,{status:n===4?'All systems connected':n+' of 4 apps connected',hub:'your workspace'})}</div>
 <div id="slot"></div>
 <div class="cards" style="grid-column:1/-1">
 <div class="gc"><div class="gh"><span class="ib">${ic('tasks')}</span><h3>Today’s Priorities</h3><a data-v="tasks">View all ${ic('arrow')}</a></div>
 ${o.map((t,i)=>`<div class="pr ${i?'':'cur'}"><button class="dt" data-t="${t.id}" aria-label="Complete ${esc(t.title)}"></button><span>${esc(t.title)}</span><em>${esc(t.due||'')}</em></div>`).join('')||'<p class="note">All clear. Ask Avo to add a task.</p>'}</div>
 <div class="gc"><div class="gh"><span class="ib">${ic('cal')}</span><h3>Upcoming Appointments</h3><a data-v="cal">View all ${ic('arrow')}</a></div>
 <div class="ap"><div class="date"><span>${DAYS[dd.getDay()]}</span><b>${dd.getDate()}</b></div><div>${up.map(a=>`<div class="ar">${ic('cal')}<div>${esc(a.title)}<small>${tm(a.starts_at)}${a.ends_at?' – '+tm(a.ends_at):''}</small></div><span class="rb">${ic(a.kind==='call'?'phone':'users')}</span></div>`).join('')||'<p class="note">Nothing scheduled. Ask Avo to book something.</p>'}</div></div></div>
 <div class="gc"><div class="gh"><span class="ib">${ic('trend')}</span><h3>Business Overview</h3><select id="rg" aria-label="Range"><option>This Week</option><option ${S.range==="This Month"?'selected':''}>This Month</option></select></div>
 <div class="chart"><svg viewBox="0 0 400 130" preserveAspectRatio="none"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity=".25"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient></defs><path d="${d}L392 130L8 130z" fill="url(#gf)"/><path d="${d}" fill="none" stroke="#1d7a4d" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg><div class="bd2">${sum} done ${ic('up','width:18px;height:18px')}</div></div></div></div></div>`}
const dt=d=>new Date(d).toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
function rowsView(){
 if(view==="tasks"){const all=[...openT(),...S.tasks.filter(t=>t.done)];
  return `<form class="add" id="tf"><input id="tt" placeholder="New task" aria-label="Task title" required maxlength="300"><select id="tp" aria-label="Priority"><option>High</option><option selected>Medium</option><option>Low</option></select><button class="btn">Add task</button></form><div class="box">${all.map(t=>`<div class="rw ${t.done?'done':''}"><input type="checkbox" data-c="${t.id}" ${t.done?'checked':''} aria-label="Complete"><div class="g"><span class="t">${esc(t.title)}</span><small>${esc(t.priority)}${t.due?' · '+esc(t.due):''}</small></div><button class="x" data-del="tasks:${t.id}" aria-label="Delete">×</button></div>`).join('')||'<p class="note" style="padding:12px 0">No tasks yet. Add your first one above.</p>'}</div>`}
 if(view==="cal")return `<form class="add" id="cf2"><input id="ct" placeholder="Appointment title" required maxlength="300"><input id="cd" type="datetime-local" required aria-label="Date and time"><select id="ck" aria-label="Type"><option value="meeting">Meeting</option><option value="call">Call</option></select><button class="btn">Add</button></form><div class="box">${S.appts.map(a=>`<div class="rw"><div class="g"><b>${esc(a.title)}</b><small>${dt(a.starts_at)}</small></div><button class="x" data-del="appointments:${a.id}" aria-label="Delete">×</button></div>`).join('')||'<p class="note" style="padding:12px 0">Nothing scheduled yet.</p>'}</div>`;
 if(view==="cust")return `<form class="add" id="cuf"><input id="cn" placeholder="Customer name" required maxlength="200"><input id="ce" type="email" placeholder="Email (optional)"><button class="btn">Add customer</button></form><div class="box">${S.customers.map(c=>`<div class="rw"><div class="g"><b>${esc(c.name)}</b><small>${esc([c.kind,c.email,c.phone].filter(Boolean).join(' · '))}</small></div><span>${esc(c.status||'')}</span><button class="x" data-del="customers:${c.id}" aria-label="Delete">×</button></div>`).join('')||'<p class="note" style="padding:12px 0">No customers yet.</p>'}</div>`;
 if(view==="auto")return `<div class="box">${S.auto.map(a=>`<div class="rw"><div class="g">${esc(a.name)}</div><button class="sw" role="switch" aria-checked="${a.enabled}" aria-label="Toggle automation" data-a="${a.id}"></button></div>`).join('')}</div><p class="note">Automations are saved to your account. Running them on real emails comes with the Gmail connection.</p><h3 style="margin-top:24px">Recent activity</h3><div class="box" style="margin-top:10px">${S.activity.map(l=>`<div class="rw"><div class="g">${esc(l.text)}<small>${dt(l.created_at)}</small></div></div>`).join('')||'<p class="note" style="padding:12px 0">Nothing yet.</p>'}</div>`;
 if(view==="int")return `<div class="box">${APPS.map(k=>`<div class="rw"><div class="g"><b>${k}</b><small>${S.integ[k]?'Linked (demo)':'Not linked'}</small></div><button class="btn o" data-k="${k}">${S.integ[k]?'Disconnect':'Connect'}</button></div>`).join('')}</div><p class="note">These are demo links. Avo does not read your real Gmail, Calendar, Notion, or Slack yet. Real sign-in with each app is the next step.</p>`;
 return `<div class="box"><div class="rw"><div class="g"><b>Your name</b><small>${esc(S.user.email)}</small></div><input id="nm" value="${esc(name())}" maxlength="60" style="padding:10px 16px;border-radius:99px;border:1px solid var(--line);width:160px"><button class="btn" id="nsave">Save</button></div>
 <div class="rw"><div class="g"><b>Avo asks before acting</b><small>Emails and big changes need your OK</small></div><button class="sw" role="switch" aria-checked="${S.settings.confirm_actions}" data-s="confirm_actions" aria-label="Confirm actions"></button></div>
 <div class="rw"><div class="g"><b>Remember business context</b><small>Lets Avo remember customers and preferences</small></div><button class="sw" role="switch" aria-checked="${S.settings.remember_context}" data-s="remember_context" aria-label="Remember context"></button></div>
 <div class="rw"><div class="g"><b>Sample data</b><small>The starter tasks, customers, and appointments</small></div><button class="btn o" id="clr">Clear sample data</button></div>
 <div class="rw"><div class="g"><b>Account</b></div><button class="btn" id="so">Sign out</button></div></div>`}
function glance(){const td=S.appts.filter(a=>sod(a.starts_at).getTime()===sod(new Date()).getTime()).length;
 $('#gl').innerHTML=`<div>${ic('cal')}${td} meeting${td===1?'':'s'} today</div><div>${ic('tasks')}${openT().length} tasks pending</div><div>${ic('users')}${S.customers.length} customer${S.customers.length===1?"":"s"}</div>`;
 const h=new Date().getHours();$('#pgreet').innerHTML=`Good ${h<12?'morning':h<18?'afternoon':'evening'}, ${esc(name())}!<br>Here’s your day at a glance:`}
function mount(){const slot=$('#slot'),inHome=view==="home"&&wide()&&pOpen&&slot;
 if(inHome){slot.appendChild(P);P.classList.remove('float')}else{document.body.appendChild(P);P.classList.add('float')}
 P.style.display=pOpen?'flex':'none';$('#pill').style.display=pOpen?'none':'flex'}
function render(){if(!S.user)return;document.body.appendChild(P);head();
 $('#nav').innerHTML=NAV.map(n=>`<button data-v="${n[0]}" class="${n[0]===view?'on':''}">${ic(n[0])}${n[1]}</button>`).join('');
 $('#v').innerHTML=view==="home"?homeHTML():rowsView();
 document.querySelectorAll('[data-i]').forEach(e=>{if(!e.closest('#v'))e.outerHTML=ic(e.dataset.i)});
 glance();mount();bind()}
const upd=async(t,id,patch)=>db(T(t).update(patch).eq('id',id).select().single());
function bind(){const v=$('#v'),all=(s,f)=>v.querySelectorAll(s).forEach(f);
 all('[data-t]',b=>b.onclick=()=>TOOLS.complete_task({id:b.dataset.t}).then(render));
 all('[data-c]',c=>c.onchange=async()=>{const r=await upd('tasks',c.dataset.c,{done:c.checked,done_at:c.checked?new Date().toISOString():null});if(r&&r!==true)Object.assign(S.tasks.find(t=>t.id===r.id),r);render()});
 all('[data-del]',b=>b.onclick=async()=>{const [t,id]=b.dataset.del.split(':');if(await db(T(t).delete().eq('id',id))){const k={tasks:'tasks',appointments:'appts',customers:'customers'}[t];S[k]=S[k].filter(x=>x.id!==id);render()}});
 all('[data-a]',b=>b.onclick=async()=>{const a=S.auto.find(x=>x.id===b.dataset.a);await TOOLS.toggle_automation({id:a.id,enabled:!a.enabled,name:a.name});render()});
 all('[data-k]',b=>b.onclick=async()=>{const k=b.dataset.k,on=!S.integ[k];if(await db(T('integrations').upsert({user_id:S.user.id,app:k,connected:on}))){S.integ[k]=on;render()}});
 all('[data-s]',b=>b.onclick=async()=>{const k=b.dataset.s,r=await db(T('settings').update({[k]:!S.settings[k]}).eq('user_id',S.user.id).select().single());if(r&&r!==true){S.settings=r;render()}});
 all('[data-go]',b=>b.onclick=()=>{view=b.dataset.go;render()});all('[data-v]',b=>b.onclick=()=>{view=b.dataset.v;render()});
 const f=(id,fn)=>{const e=$(id);if(e)e.onsubmit=async ev=>{ev.preventDefault();await fn();render()}};
 f('#tf',()=>TOOLS.create_task({title:$('#tt').value.trim(),priority:$('#tp').value}));
 f('#cf2',()=>TOOLS.create_appointment({title:$('#ct').value.trim(),starts_at:new Date($('#cd').value).toISOString(),ends_at:new Date(+new Date($('#cd').value)+36e5).toISOString(),kind:$('#ck').value}));
 f('#cuf',()=>TOOLS.create_customer({name:$('#cn').value.trim(),email:$('#ce').value.trim()}));
 const rg=$('#rg');if(rg)rg.onchange=()=>{S.range=rg.value;render()};
  const ns=$('#nsave');if(ns)ns.onclick=async()=>{const r=await db(T('settings').update({display_name:$('#nm').value.trim()||null}).eq('user_id',S.user.id).select().single());if(r&&r!==true){S.settings=r;toast('Saved');render()}};
 const so=$('#so');if(so)so.onclick=()=>sb.auth.signOut();
 const cl=$('#clr');if(cl)cl.onclick=async()=>{if(!confirm('Delete the sample tasks, customers, and appointments?'))return;for(const t of['tasks','customers','appointments'])await db(T(t).delete().eq('sample',true));await loadAll();render()}}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;render()}});
document.querySelector('.av').onclick=()=>{view="set";render()};

/* ---------- Avo chat ---------- */
function say(t,role){const d=document.createElement('div');d.textContent=t;if(role==='user')d.className='me';$('#lg').append(d);$('.pbody').scrollTop=1e9}
function renderMsgs(){$('#lg').innerHTML='';S.msgs.slice(-12).forEach(m=>say(m.content,m.role))}
const store=(role,content)=>S.settings?.remember_context!==false&&T('messages').insert({role,content}).then(()=>{});
const ctx=()=>({name:name(),now:new Date(),tasks:S.tasks,appts:S.appts,customers:S.customers,automations:S.auto});
async function ask(q){say(q,'user');store('user',q);
 const res=await AvoAI.respond(q,ctx());
 for(const a of res.actions||[]){try{await TOOLS[a.tool]?.(a.args)}catch(e){console.error(e)}}
 say(res.reply,'avo');store('avo',res.reply);render()}
$('#cf').onsubmit=e=>{e.preventDefault();const q=$('#ci').value.trim();if(q){$('#ci').value='';ask(q)}};
$('#sq').onkeydown=e=>{if(e.key==="Enter"&&e.target.value.trim()){pOpen=true;render();ask(e.target.value.trim());e.target.value=''}};
$('#pclose').onclick=()=>{pOpen=false;render()};
$('#pmin').onclick=()=>P.classList.toggle('min');
$('#pill').onclick=()=>{pOpen=true;render()};
$('#vd').onclick=()=>ask('plan my day');
$('#upg').onclick=()=>{pOpen=true;render();say("Pricing is set after early-access pilots. For now everything here is free.",'avo')};
matchMedia('(min-width:1181px)').addEventListener('change',render);
if(!wide())pOpen=false;
document.querySelectorAll('.side [data-i], header [data-i]').forEach(e=>e.outerHTML=ic(e.dataset.i));
document.querySelectorAll('[data-i]').forEach(e=>{if(!e.closest('#v'))e.outerHTML=ic(e.dataset.i)});
authMode('in');
sb.auth.getSession().then(({data})=>{if(data.session&&mode!=='reset')boot(data.session.user)});

</script>
