<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aveniq Flow – Workspace (demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#102D23;--muted:#68776F;--deep:#092F24;--green:#174D37;--em:#22C55E;--cream:#F8F5EC;--glass:rgba(255,255,255,.62);--line:rgba(23,77,55,.14);color-scheme:light}
*{box-sizing:border-box;margin:0}
body{display:flex;min-height:100vh;color:var(--ink);font:400 16px/1.45 Figtree,system-ui,sans-serif;background:
radial-gradient(ellipse 40% 20% at 100% 104%,#1c5a41 0 62%,transparent 63%),radial-gradient(ellipse 34% 15% at 22% 106%,#206046 0 58%,transparent 59%),
radial-gradient(ellipse 55% 45% at 58% 28%,#f7f5ea,transparent 72%),linear-gradient(135deg,#dbe5cf,#eceedd 45%,#d6e3cd) fixed}
h1,h2,h3,.bd{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--em);outline-offset:2px;border-radius:10px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side{width:238px;flex:none;position:sticky;top:0;height:100vh;color:var(--cream);padding:30px 18px 26px;display:flex;flex-direction:column;border-radius:0 46px 46px 0;overflow:hidden;
background:radial-gradient(circle at 10% 0,#1c5a41,transparent 55%),radial-gradient(circle at 100% 60%,#144632,transparent 50%),linear-gradient(170deg,#0c3a2b,#07261c)}
.logo{display:flex;align-items:center;gap:12px;font:800 28px 'Bricolage Grotesque',sans-serif;padding:0 10px 34px}
.logo svg{width:40px;height:40px;color:var(--em)}
.side nav{display:grid;gap:8px}
.side nav button{display:flex;align-items:center;gap:16px;background:none;border:1.5px solid transparent;color:inherit;text-align:left;padding:13px 18px;border-radius:99px;font-size:17px;opacity:.88}
.side nav button.on{border-color:#22c55eb3;background:linear-gradient(90deg,#22c55e47,#22c55e1a);box-shadow:0 0 22px #22c55e59;opacity:1;font-weight:600}
.up{margin-top:auto;border:1.5px solid #22c55e66;border-radius:26px;padding:20px 18px;background:#ffffff0d}
.up svg{width:30px;height:30px;color:var(--em)}.up b{display:block;font-size:17px;margin-top:6px}.up p{font-size:14px;opacity:.75;margin:2px 0 14px}
.up button{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;padding:12px;border-radius:99px;border:1.5px solid var(--em);background:#12674a;color:#fff;font-weight:600}
.up button .i{width:16px;height:16px}
main{flex:1;min-width:0;padding:34px 38px 34px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(32px,3.4vw,46px);font-weight:800;line-height:1.05}
.sub{font-size:22px;font-weight:500;margin-top:8px}
.tools{display:flex;gap:18px;align-items:center}
.search{display:flex;align-items:center;gap:10px;background:#ffffff99;border:1px solid #ffffffb3;border-radius:99px;padding:0 20px;height:52px;width:min(310px,40vw);box-shadow:0 6px 20px #0a2a2012}
.search input{border:0;background:none;outline:0;flex:1;min-width:0}
.bell{position:relative;background:none;border:0;padding:6px}.bell i{position:absolute;top:4px;right:4px;width:11px;height:11px;border-radius:50%;background:var(--em);border:2px solid #eef0e1}
.av{width:50px;height:50px;border-radius:50%;background:var(--deep);color:#fff;border:0;font:700 22px 'Bricolage Grotesque'}
.tag{display:inline-block;font-size:13px;font-weight:600;background:#22c55e2e;border-radius:99px;padding:4px 12px;margin-top:10px}
.home{display:grid;grid-template-columns:1fr 372px;gap:0 20px;margin-top:6px}
.home.nopanel{grid-template-columns:1fr}
.stage{position:relative;height:455px}
.lines{position:absolute;inset:0;width:100%;height:100%}
.lines path{fill:none;stroke:#2ea160;stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px #22c55e99);stroke-dasharray:1 0}
.lines path.off{stroke:#8da096;stroke-dasharray:3 9;filter:none}
.pc{position:absolute;width:min(27%,268px);min-width:200px;display:flex;align-items:center;gap:16px;padding:20px 24px;text-align:left;border:1.5px solid #ffffffcc;border-radius:30px;background:linear-gradient(135deg,#ffffffcc,#ffffff80);backdrop-filter:blur(10px);box-shadow:0 18px 36px #0a3a2a26,inset 0 0 0 1px #ffffff80;transition:transform .2s}
.pc:hover{transform:translateY(-4px) rotate(var(--r))}
.pc::after{content:"";position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:#fffffff0;box-shadow:0 0 0 1.5px #ffffffcc}
.pc.kr::after{right:-17px}.pc.kl::after{left:-17px}
.pc b{display:block;font:700 23px 'Bricolage Grotesque'}.pc small{display:block;font-size:17px;color:var(--muted)}
.pc>svg{width:54px;height:54px;flex:none}
.pc .d{position:absolute;top:16px;right:20px;width:13px;height:13px;border-radius:50%;background:var(--em);box-shadow:0 0 10px var(--em)}
.pc.off{opacity:.65}.pc.off .d{background:#98a69d;box-shadow:none}
.ctr{position:absolute;left:50%;top:50%;width:330px;transform:translate(-50%,-44%);display:grid;place-items:center}
.orb{position:absolute;width:640px;max-width:90vw;left:50%;top:48%;transform:translate(-50%,-50%);pointer-events:none}
.orb ellipse{fill:none;stroke:#22c55e;stroke-opacity:.5;stroke-width:2.5;filter:drop-shadow(0 0 6px #22c55e)}
.avoimg{width:290px;position:relative;animation:fl 5s ease-in-out infinite;cursor:pointer;filter:drop-shadow(0 18px 24px #0a4a2e55)}
@keyframes fl{50%{transform:translateY(-12px)}}
.bub{position:absolute;top:-58px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fffffff2;border-radius:28px;padding:12px 26px;text-align:center;font-weight:500;box-shadow:0 10px 26px #0a2a2018;line-height:1.3}
.cards{display:grid;grid-template-columns:1.12fr 1fr .9fr;gap:20px;margin-top:20px}
.gc{background:var(--glass);backdrop-filter:blur(14px);border:1px solid #ffffffb0;border-radius:30px;padding:22px 26px;box-shadow:0 14px 34px #0a2a2014;min-width:0}
.gh{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.gh .ib{width:42px;height:42px;border-radius:14px;background:#22c55e22;display:grid;place-items:center;color:var(--green)}
.gh h3{font-size:19px;font-weight:700;flex:1}.gh a{color:var(--green);font-weight:600;font-size:15px;display:flex;gap:4px;align-items:center;cursor:pointer;background:none;border:0}.gh a .i{width:15px;height:15px}
.gh select{border:0;background:#0000000d;border-radius:99px;padding:6px 12px;font-size:14px}
.pr{display:flex;align-items:center;gap:16px;padding:7px 0;position:relative}
.pr .dt{width:22px;height:22px;border-radius:50%;border:2px solid #7b8a82;background:#fff;flex:none;padding:0;position:relative;z-index:1}
.pr.cur .dt{background:var(--em);border-color:var(--em);box-shadow:0 0 0 4px #22c55e30}
.pr:not(:last-child)::after{content:"";position:absolute;left:10px;top:30px;height:20px;width:2px;background:#9fb3a8}
.pr span{flex:1}.pr em{font-style:normal;color:var(--muted);font-size:15px}
.pr.done span{text-decoration:line-through;opacity:.5}
.ap{display:grid;grid-template-columns:86px 1fr;gap:14px}
.date{background:#ffffffcc;border-radius:20px;display:grid;place-items:center;align-content:center;padding:10px;font-weight:600}.date b{font:800 38px/1 'Bricolage Grotesque'}
.ar{display:flex;align-items:center;gap:12px;padding:6px 0}.ar>.i{color:var(--muted)}.ar div{flex:1;font-weight:500}.ar small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.ar .rb{width:38px;height:38px;border-radius:50%;background:#22c55e26;display:grid;place-items:center;color:var(--green)}
.chart{position:relative}.chart svg{width:100%;height:130px;display:block}
.chart .bd2{position:absolute;top:2px;right:0;background:#fff;border-radius:14px;padding:6px 12px;font:700 20px 'Bricolage Grotesque';color:var(--green);box-shadow:0 8px 20px #0a2a2018}
.panel{background:#ffffffb8;backdrop-filter:blur(16px);border:1px solid #ffffffd0;border-radius:32px;padding:18px 20px;box-shadow:0 20px 50px #0a2a2026;display:flex;flex-direction:column;align-self:start;max-height:calc(100vh - 40px)}
.panel.float{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(372px,calc(100vw - 36px));z-index:20}
.ph{display:flex;align-items:center;gap:12px}.ph .o{width:24px;height:24px;border-radius:50%;background:var(--green);display:grid;place-items:center}.ph .o::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--em)}
.ph b{font:700 20px 'Bricolage Grotesque';display:block;line-height:1}.ph small{color:var(--muted);font-size:13px}.ph div{flex:1}
.ph button{width:40px;height:34px;border-radius:12px;border:0;background:#0000000d;display:grid;place-items:center}.ph button .i{width:18px;height:18px}
.pbody{display:flex;flex-direction:column;gap:12px;margin-top:14px;overflow:auto;min-height:0}
.panel.min .pbody,.panel.min .pin{display:none}
.mrow{display:flex;gap:12px;align-items:center;background:#ffffff99;border-radius:22px;padding:8px 14px 8px 8px;font-weight:500}
.ava{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#c9efd3,#6fbf8c);flex:none;overflow:hidden}.ava svg{width:100%;height:100%}
.gl{background:#ffffff99;border-radius:22px;padding:14px 18px;display:grid;gap:12px;font-weight:500}.gl div{display:flex;gap:14px;align-items:center}.gl .i{color:var(--green)}
.vd{align-self:center;display:flex;gap:8px;align-items:center;background:var(--deep);color:#fff;border:0;border-radius:99px;padding:15px 28px;font-weight:600}.vd .i{width:18px;height:18px}
.lg{display:grid;gap:8px;font-size:15px}.lg div{background:#ffffffb3;padding:9px 14px;border-radius:16px;max-width:90%}.lg .me{background:var(--em);color:#04170f;justify-self:end}
.pin{display:flex;gap:8px;margin-top:14px;background:#ffffffcc;border-radius:99px;padding:5px 5px 5px 20px;align-items:center}.pin input{flex:1;border:0;background:none;outline:0;min-width:0}
.pin button{width:44px;height:44px;border-radius:50%;border:0;background:var(--deep);color:#fff;display:grid;place-items:center}.pin button .i{width:18px;height:18px}
.pill{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:12px;background:var(--deep);color:#fff;border:0;border-radius:99px;padding:8px 22px 8px 10px;text-align:left;z-index:20;box-shadow:0 14px 34px #0a2a2055}
.pill .ava{width:48px;height:48px}.pill small{display:block;opacity:.75}
.box{background:var(--glass);border:1px solid #ffffffb0;border-radius:28px;padding:10px 24px;margin-top:22px;max-width:860px;box-shadow:0 14px 34px #0a2a2014}
.rw{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.rw:last-child{border:0}.rw .g{flex:1;min-width:0}.rw small{display:block;color:var(--muted)}
.rw.done .t{text-decoration:line-through;opacity:.5}
.btn{background:var(--deep);color:#fff;border:0;border-radius:99px;padding:11px 20px;font-weight:600}.btn.o{background:none;color:var(--ink);border:1.5px solid var(--line)}
.add{display:flex;gap:10px;margin-top:22px;max-width:860px;flex-wrap:wrap}.add input{flex:1;min-width:180px;padding:12px 18px;border-radius:99px;border:1px solid #fff;background:#ffffffb3}
.sw{width:46px;height:27px;border-radius:99px;background:#c8d3cb;border:0;position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}.sw[aria-checked=true]{background:var(--em)}.sw[aria-checked=true]::after{left:22px}
.note{color:var(--muted);margin-top:12px;font-size:14px}
@media (max-width:1180px){.home{grid-template-columns:1fr}.home .panel{display:none}.pill.show{display:flex}.cards{grid-template-columns:1fr 1fr}.cards .gc:last-child{grid-column:1/-1}}
@media (max-width:760px){body{flex-direction:column}.side{width:100%;height:auto;flex-direction:row;border-radius:0 0 26px 26px;padding:10px;z-index:15;overflow-x:auto}.logo,.up{display:none}.side nav{display:flex}.side nav button{white-space:nowrap;padding:10px 14px;font-size:15px}.side nav .i{display:none}main{padding:20px 16px 90px}.tools{width:100%}.search{flex:1;width:auto}
.stage{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}.lines,.orb{display:none}.pc{position:static;width:auto;min-width:0;transform:none!important;padding:14px;flex-direction:column;align-items:flex-start;gap:8px}.pc::after{display:none}.pc>svg{width:40px;height:40px}.pc b{font-size:18px}.pc small{font-size:14px}.ctr{position:static;transform:none;grid-column:1/-1;order:-1;width:auto;padding-top:56px}.avoimg{width:220px}.cards{grid-template-columns:1fr}.gc:last-child{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="star" viewBox="0 0 24 24"><path d="M12 0c.8 6.4 5.6 11.2 12 12-6.4.8-11.2 5.6-12 12-.8-6.4-5.6-11.2-12-12C6.4 11.2 11.2 6.4 12 0z" fill="currentColor"/></symbol>

<script>
const $=s=>document.querySelector(s);
const IC={home:'<path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',tasks:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',cust:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',auto:'<path d="M13 2L3 14h9l-1 8 10-12h-9z"/>',int:'<path d="M10 3h4v3a2 2 0 1 0 4 0h3v5h-3a2 2 0 1 0 0 4h3v6h-5v-3a2 2 0 1 0-4 0v3H5v-6h3a2 2 0 1 0 0-4H5V3z"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',search:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>',mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',arrow:'<path d="M5 12h14M12 5l7 7-7 7"/>',minus:'<path d="M5 12h14"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',trend:'<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',up:'<path d="M7 17L17 7M7 7h10v10"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const NAV=[["home","Home"],["tasks","Tasks"],["cal","Calendar"],["cust","Customers"],["auto","Automations"],["int","Integrations"],["set","Settings"]];
const LG={Gmail:'<svg viewBox="0 0 40 40"><path d="M5 31V11l15 11 15-11v20" fill="none" stroke="#EA4335" stroke-width="6" stroke-linejoin="round"/><path d="M5 31V13" stroke="#4285F4" stroke-width="6"/><path d="M35 31V13" stroke="#34A853" stroke-width="6"/></svg>',
Calendar:'<svg viewBox="0 0 40 40"><rect x="2" y="2" width="36" height="36" rx="8" fill="#fff" stroke="#4285F4" stroke-width="3"/><path d="M2 12h36" stroke="#4285F4" stroke-width="8"/><text x="20" y="32" font-size="17" font-weight="700" text-anchor="middle" fill="#4285F4">31</text></svg>',
Notion:'<svg viewBox="0 0 40 40"><rect x="3" y="3" width="34" height="34" rx="7" fill="#fff" stroke="#111" stroke-width="3"/><text x="20" y="29" font-size="24" font-weight="800" font-family="Georgia,serif" text-anchor="middle" fill="#111">N</text></svg>',
Slack:'<svg viewBox="0 0 40 40"><rect x="4" y="16" width="16" height="7" rx="3.5" fill="#36C5F0"/><rect x="16" y="4" width="7" height="16" rx="3.5" fill="#2EB67D"/><rect x="20" y="16" width="16" height="7" rx="3.5" fill="#ECB22E"/><rect x="16" y="20" width="7" height="16" rx="3.5" fill="#E01E5A"/></svg>'};
const now=new Date(),DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const S={tasks:[{t:"Client meeting with Sarah",d:"9:00 AM",x:0},{t:"Reply to customer emails",d:"11:30 AM",x:0},{t:"Prepare marketing report",d:"3:00 PM",x:0}],
appts:[["Team Sync","10:00 AM – 11:00 AM","users"],["Client Call","2:00 PM – 2:30 PM","phone"]],
cust:[["Sarah Mitchell","Commercial","Meeting today"],["Oakridge Dental","Commercial","Quote pending"],["Hartley Home","Residential","Recurring biweekly"],["J. Park","Residential","New inquiry"]],
auto:[["New customer inquiry → create follow-up task",1],["Appointment scheduled → prepare reminder",1],["Email needs reply → create draft",0]],
on:{Gmail:1,Calendar:1,Notion:1,Slack:1},log:["Demo workspace loaded"],emails:1,range:"This Week"};
const CH={"This Week":["M8 112C40 92 70 118 105 96S160 50 200 74 262 82 300 38s50-14 92-20","+24%"],"This Month":["M8 100C50 110 80 80 120 88S180 60 220 66 290 30 330 44s40-18 62-24","+18%"]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const openT=()=>S.tasks.filter(t=>!t.x);
let view="home",pOpen=true;
const wide=()=>matchMedia('(min-width:1181px)').matches;

function head(){const h=now.getHours();$('#h').textContent=view==="home"?`Good ${h<12?'morning':h<18?'afternoon':'evening'}, Hassen!`:NAV.find(n=>n[0]===view)[1];
 $('#sub').textContent=view==="home"?"Let’s make today productive ✨":"";$('#sub').style.display=view==="home"?"":"none"}
function card(k,cls,style,sub){const on=S.on[k];return `<button class="pc ${cls} ${on?'':'off'}" style="${style}" data-go="int"><span class="d"></span>${LG[k]}<span><b>${k}</b><small>${on?'Connected':'Disconnected'}</small></span></button>`}
function homeHTML(){
 const o=openT().slice(0,3),ch=CH[S.range];
 const L=(k,d)=>`<path class="${S.on[k]?'':'off'}" d="${d}"/>`;
 return `<div class="home ${pOpen&&wide()?'':'nopanel'}"><div class="stage">
 <svg class="lines" viewBox="0 0 1000 455" preserveAspectRatio="none">${L('Gmail','M262 120C370 118 390 205 450 250')}${L('Calendar','M742 130C640 130 630 200 560 250')}${L('Notion','M270 372C360 380 390 320 450 295')}${L('Slack','M740 372C650 380 620 320 555 295')}</svg>
 ${card('Gmail','kr','left:2%;top:5%;--r:-8deg;transform:rotate(-8deg)')}${card('Calendar','kl','right:1%;top:7%;--r:8deg;transform:rotate(8deg)')}${card('Notion','kl','left:0;top:58%;--r:8deg;transform:rotate(8deg)')}${card('Slack','kl','right:2%;top:60%;--r:-8deg;transform:rotate(-8deg)')}
 <div class="ctr"><svg class="orb" viewBox="0 0 640 260"><ellipse cx="320" cy="140" rx="300" ry="82"/><ellipse cx="320" cy="140" rx="250" ry="62" stroke-opacity=".3"/></svg><div class="bub">You’re all set!<br>Let’s crush today. 💚</div><svg class="avoimg" id="avo" viewBox="0 0 200 220" role="button" aria-label="Open Avo"><use href="#avo"/></svg></div></div>
 <div id="slot"></div>
 <div class="cards" style="grid-column:1/-1">
 <div class="gc"><div class="gh"><span class="ib">${ic('tasks')}</span><h3>Today’s Priorities</h3><a data-v="tasks">View all ${ic('arrow')}</a></div>
 ${o.map((t,i)=>`<div class="pr ${i?'':'cur'}"><button class="dt" data-t="${S.tasks.indexOf(t)}" aria-label="Complete ${esc(t.t)}"></button><span>${esc(t.t)}</span><em>${esc(t.d)}</em></div>`).join('')||'<p class="note">All clear. Ask Avo to add a task.</p>'}</div>
 <div class="gc"><div class="gh"><span class="ib">${ic('cal')}</span><h3>Upcoming Appointments</h3><a data-v="cal">View all ${ic('arrow')}</a></div>
 <div class="ap"><div class="date"><span>${DAYS[now.getDay()]}</span><b>${now.getDate()}</b></div><div>${S.appts.map(a=>`<div class="ar">${ic('cal')}<div>${a[0]}<small>${a[1]}</small></div><span class="rb">${ic(a[2])}</span></div>`).join('')}</div></div></div>
 <div class="gc"><div class="gh"><span class="ib">${ic('trend')}</span><h3>Business Overview</h3><select id="rg" aria-label="Range"><option>This Week</option><option ${S.range==="This Month"?'selected':''}>This Month</option></select></div>
 <div class="chart"><svg viewBox="0 0 400 130" preserveAspectRatio="none"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity=".25"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient></defs><path d="${ch[0]}L392 130L8 130z" fill="url(#gf)"/><path d="${ch[0]}" fill="none" stroke="#1d7a4d" stroke-width="3.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg><div class="bd2">${ch[1]} ${ic('up').replace('class="i"','class="i" style="width:18px;height:18px"')}</div></div></div></div></div>`}
function rowsView(){
 if(view==="tasks")return `<form class="add" id="tf"><input id="tt" placeholder="New task" aria-label="Task title" required><button class="btn">Add task</button></form><div class="box">${S.tasks.map((t,i)=>`<div class="rw ${t.x?'done':''}"><input type="checkbox" data-i="${i}" ${t.x?'checked':''} aria-label="Complete"><div class="g"><span class="t">${esc(t.t)}</span><small>${esc(t.d)}</small></div></div>`).join('')||'<p class="note">No tasks yet. Add your first one above.</p>'}</div>`;
 if(view==="cal")return `<div class="box">${S.appts.map(a=>`<div class="rw"><div class="g"><b>${a[0]}</b><small>${DAYS[now.getDay()]} ${now.getDate()} · ${a[1]}</small></div></div>`).join('')}</div><p class="note">No scheduling conflicts found.</p>`;
 if(view==="cust")return `<div class="box">${S.cust.map(c=>`<div class="rw"><div class="g"><b>${c[0]}</b><small>${c[1]}</small></div><span>${c[2]}</span></div>`).join('')}</div><p class="note">Showing 4 of 248 sample customers.</p>`;
 if(view==="auto")return `<div class="box">${S.auto.map((a,i)=>`<div class="rw"><div class="g">${a[0]}</div><button class="sw" role="switch" aria-checked="${!!a[1]}" aria-label="Toggle automation" data-a="${i}"></button></div>`).join('')}</div><h3 style="margin-top:24px">Recent activity</h3><div class="box" style="margin-top:10px">${S.log.map(l=>`<div class="rw">${esc(l)}</div>`).join('')}</div>`;
 if(view==="int")return `<div class="box">${Object.keys(S.on).map(k=>`<div class="rw"><div class="g"><b>${k}</b><small>${S.on[k]?'Connected · Avo reads and drafts, you approve':'Disconnected'}</small></div><button class="btn o" data-k="${k}">${S.on[k]?'Disconnect':'Connect'}</button></div>`).join('')}</div><p class="note">Demo only. Real Google sign-in comes with the live version.</p>`;
 return `<div class="box"><div class="rw"><div class="g"><b>Avo asks before acting</b><small>Emails and big changes need your OK</small></div><button class="sw" role="switch" aria-checked="true" aria-label="Confirm actions"></button></div><div class="rw"><div class="g"><b>Remember business context</b><small>Lets Avo remember customers and preferences</small></div><button class="sw" role="switch" aria-checked="true" aria-label="Remember context"></button></div></div>`}
function glance(){$('#gl').innerHTML=`<div>${ic('cal')}${S.appts.length} meetings today</div><div>${ic('tasks')}${openT().length} tasks pending</div><div>${ic('mail')}${S.emails} new email</div>`;
 $('#pgreet').innerHTML=`Good ${now.getHours()<12?'morning':now.getHours()<18?'afternoon':'evening'}, Hassen!<br>Here’s your day at a glance:`}
function mount(){const p=$('#panel'),slot=$('#slot'),inHome=view==="home"&&wide()&&pOpen&&slot;
 if(inHome){slot.appendChild(p);p.classList.remove('float');p.style.display=''}
 else{document.body.appendChild(p);p.classList.add('float');p.style.display=pOpen?'flex':'none'}
 $('#pill').classList.toggle('show',!pOpen||(view==="home"&&!wide()&&false));$('#pill').style.display=pOpen?'none':'flex'}
function render(){head();
 $('#nav').innerHTML=NAV.map(n=>`<button data-v="${n[0]}" class="${n[0]===view?'on':''}">${ic(n[0])}${n[1]}</button>`).join('');
 $('#v').innerHTML=view==="home"?homeHTML():rowsView();
 document.querySelectorAll('[data-i]').forEach(e=>e.outerHTML=ic(e.dataset.i));
 glance();mount();bind()}
function bind(){const v=$('#v');
 v.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tasks[b.dataset.t].x=1;render()});
 v.querySelectorAll('[data-i]').forEach(c=>c.onchange=()=>{S.tasks[c.dataset.i].x=c.checked?1:0;render()});
 v.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=S.auto[b.dataset.a];a[1]=a[1]?0:1;S.log.unshift((a[1]?'Enabled: ':'Disabled: ')+a[0]);render()});
 v.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.on[b.dataset.k]=S.on[b.dataset.k]?0:1;render()});
 v.querySelectorAll('.sw:not([data-a])').forEach(b=>b.onclick=()=>b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true'));
 v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()});
 v.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
 const tf=$('#tf');if(tf)tf.onsubmit=e=>{e.preventDefault();addTask($('#tt').value);render()};
 const rg=$('#rg');if(rg)rg.onchange=()=>{S.range=rg.value;render()};
 const av=$('#avo');if(av)av.onclick=()=>{pOpen=true;render();$('#ci').focus()}}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;render()}});
function addTask(t,d){t=t.trim();if(!t)return;S.tasks.unshift({t,d:d||"Anytime",x:0});S.log.unshift("Created task: "+t)}
function say(t,me){const d=document.createElement('div');d.textContent=t;if(me)d.className='me';$('#lg').append(d);$('.pbody').scrollTop=1e9}
function ask(q){say(q,1);const l=q.toLowerCase();let r;
 const m=q.match(/(?:create|add|make)(?: a)? task(?: to)? (.+)/i);
 if(m){let d="Anytime",t=m[1].replace(/\s+(today|tomorrow)$/i,(x,y)=>{d=y[0].toUpperCase()+y.slice(1);return''});addTask(t,d);r=`Done. I added “${t}” (${d}).`;setTimeout(render,0)}
 else if(/plan|day|schedule/.test(l))r=`Today: ${S.appts.map(a=>a[0]+' at '+a[1].split(' –')[0]).join(', ')}. You also have ${openT().length} open tasks.`;
 else if(/task/.test(l))r=`You have ${openT().length} open tasks. Next up: ${(openT()[0]||{t:'nothing'}).t}.`;
 else if(/email|mail/.test(l))r="You have 1 sample email. I can draft a reply, and you approve before it sends.";
 else r="In this demo I can plan your day, list tasks, and create tasks. The live version connects to your real apps.";
 setTimeout(()=>say(r),300)}
$('#cf').onsubmit=e=>{e.preventDefault();const q=$('#ci').value.trim();if(q){$('#ci').value='';ask(q)}};
$('#sq').onkeydown=e=>{if(e.key==="Enter"&&e.target.value.trim()){pOpen=true;render();ask(e.target.value.trim());e.target.value=''}};
$('#pclose').onclick=()=>{pOpen=false;render()};
$('#pmin').onclick=()=>$('#panel').classList.toggle('min');
$('#pill').onclick=()=>{pOpen=true;render()};
$('#vd').onclick=()=>{view="cal";render()};
$('#upg').onclick=()=>{pOpen=true;render();say("Pricing is set after early-access pilots. For now every feature in this demo is free.")};
matchMedia('(min-width:1181px)').addEventListener('change',render);
if(!wide())pOpen=false;
render();
</script>
</body>
</html>
